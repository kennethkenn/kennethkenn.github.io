<header id="site-header">
    <div class="container header-container">
        <a href="{{ '/' | relative_url }}" class="logo" aria-label="{{ site.title }} home">
            <img src="{{ '/assets/images/profile-mark.png' | relative_url }}" alt="" class="logo-mark"
                width="675" height="1049" aria-hidden="true">
            <span class="logo-type">
                <span class="logo-text">The Mint Coder</span>
                <span class="logo-meta">Engineering folio</span>
            </span>
        </a>

        <nav class="nav-menu" id="nav-menu" aria-label="Main navigation">
            <ul>
                <li>
                    <a href="{{ '/' | relative_url }}" class="nav-link"
                        {% if page.url == "/" %}aria-current="page"{% endif %}>
                        <span class="nav-label">Home</span>
                    </a>
                </li>
                <li>
                    <a href="{{ '/projects' | relative_url }}" class="nav-link"
                        {% if page.url contains "/projects" %}aria-current="page"{% endif %}>
                        <span class="nav-label">Work</span>
                    </a>
                </li>
                <li>
                    <a href="{{ '/about' | relative_url }}" class="nav-link"
                        {% if page.url contains "/about" %}aria-current="page"{% endif %}>
                        <span class="nav-label">About</span>
                    </a>
                </li>
                <li>
                    <a href="{{ '/blog' | relative_url }}" class="nav-link"
                        {% if page.url contains "/blog" or page.collection == "posts" %}aria-current="page"{% endif %}>
                        <span class="nav-label">Journal</span>
                    </a>
                </li>
                <li>
                    <a href="{{ '/contacts' | relative_url }}" class="nav-link"
                        {% if page.url contains "/contacts" %}aria-current="page"{% endif %}>
                        <span class="nav-label">Contact</span>
                    </a>
                </li>
            </ul>
        </nav>

        <div class="header-actions">
            <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="nav-menu">
                <span class="hamburger"></span>
            </button>
        </div>
    </div>
    <div class="scroll-progress" aria-hidden="true"><span data-scroll-progress></span></div>
</header>
