<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
<link rel="apple-touch-icon" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">
<meta name="theme-color" content="#FAFAF7">
<script>
  // Flag JS early so progressive-enhancement styles can opt in safely.
  document.documentElement.classList.add('js');

  // Apply the saved theme before first paint to avoid a flash of the wrong theme.
  (function () {
    var theme = 'light';
    var saved = null;
    try {
      saved = localStorage.getItem('theme');
    } catch (e) { }
    if (saved === 'dark' || saved === 'light') {
      theme = saved;
    } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      theme = 'dark';
    }
    document.documentElement.setAttribute('data-theme', theme);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) {
      meta.setAttribute('content', theme === 'dark' ? '#0B0F0D' : '#FAFAF7');
    }
  })();
</script>
